name: Build Minecraft AI Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Inspect packages
        run: |
          unzip -t dist/Minecraft-AI-Builder-Android.mcpack
          unzip -t dist/Minecraft-AI-Builder-Server.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-AI-Builder-v0.1.0
          path: |
            dist/Minecraft-AI-Builder-Android.mcpack
            dist/Minecraft-AI-Builder-Server.mcpack
            dist/backend/worker.mjs
            dist/backend/wrangler.toml.example
            dist/blueprint.schema.json
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Minecraft-AI-Builder-Android.mcpack
            dist/Minecraft-AI-Builder-Server.mcpack
            dist/backend/worker.mjs
            dist/backend/wrangler.toml.example
            dist/blueprint.schema.json
